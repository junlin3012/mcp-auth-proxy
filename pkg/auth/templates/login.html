<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Fluid Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Proza+Libre:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: "Proza Libre", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #FFFBF7;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2E2725;
      }
      .login-container {
        background: #F6F1EB;
        padding: 2.5rem;
        border-radius: 12px;
        border: 1.5px solid #E5DCD2;
        box-shadow: 0 8px 32px rgba(64, 20, 16, 0.08);
        text-align: center;
        min-width: 350px;
        max-width: 400px;
        width: 100%;
      }
      .logo-text {
        font-size: 0.85rem;
        font-weight: 500;
        color: #78401F;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 0.25rem;
      }
      h1 {
        color: #401410;
        margin-bottom: 2rem;
        margin-top: 0.25rem;
        font-size: 1.75rem;
        font-weight: 700;
      }
      .form-group {
        margin-bottom: 1.5rem;
        text-align: left;
      }
      .form-label {
        display: block;
        margin-bottom: 0.5rem;
        color: #5E281F;
        font-weight: 500;
        font-size: 0.9rem;
      }
      .form-input {
        width: 100%;
        padding: 12px 16px;
        border: 1.5px solid #E5DCD2;
        border-radius: 8px;
        font-size: 16px;
        font-family: inherit;
        background: #FFFBF7;
        color: #2E2725;
        transition: border-color 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
      }
      .form-input:focus {
        outline: none;
        border-color: #78401F;
        box-shadow: 0 0 0 3px rgba(120, 64, 31, 0.1);
      }
      .password-button {
        width: 100%;
        padding: 12px 20px;
        background: #78401F;
        color: #FFFBF7;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
      }
      .password-button:hover {
        background: #5E281F;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(94, 40, 31, 0.25);
      }
      .divider {
        margin: 1.5rem 0;
        position: relative;
        color: #9E9489;
        font-size: 0.85rem;
      }
      .divider::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 1px;
        background: #E5DCD2;
        z-index: 1;
      }
      .divider span {
        background: #F6F1EB;
        padding: 0 1rem;
        position: relative;
        z-index: 2;
      }
      .provider-button {
        display: block;
        width: 100%;
        padding: 12px 20px;
        margin: 12px auto;
        text-decoration: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 500;
        font-family: inherit;
        transition: transform 0.2s, box-shadow 0.2s;
        border: none;
        cursor: pointer;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        box-sizing: border-box;
      }
      .provider-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
      }
      .google {
        background-color: #083E43;
        color: #FFFBF7;
      }
      .google:hover {
        background-color: #0A2730;
      }
      .github {
        background-color: #2E2725;
        color: #FFFBF7;
      }
      .github:hover {
        background-color: #401410;
      }
      .oidc {
        background-color: #083E43;
        color: #FFFBF7;
      }
      .oidc:hover {
        background-color: #0A2730;
      }
      .error-message {
        color: #a03020;
        font-size: 0.9rem;
        margin-top: 0.5rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="logo-text">Fluid Intelligence</div>
      <h1>Sign In</h1>

      {{if .HasPassword}}
      <form class="password-form" action="/.auth/login" method="POST">
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            required
          />
        </div>
        <button class="password-button" type="submit">Login</button>
        {{if .PasswordError}}
        <div class="error-message">{{.PasswordError}}</div>
        {{end}}
      </form>
      {{end}} {{if and .HasPassword (gt (len .Providers) 0)}}
      <div class="divider">
        <span>or</span>
      </div>
      {{end}} {{range .Providers}}
      <a href="{{.AuthURL}}" class="provider-button {{.Type}}">
        Login with {{.Name}}
      </a>
      {{end}}
    </div>
  </body>
</html>
